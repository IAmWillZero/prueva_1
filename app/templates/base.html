<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Sorteos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="cabecera">
        <h1>🎲 Sorteos</h1>
        <p class="subtitulo">Ruleta · Dados · Cara o Cruz</p>
    </header>

    <main class="contenedor">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <p>Proyecto de ejemplo hecho con Python + Flask.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
